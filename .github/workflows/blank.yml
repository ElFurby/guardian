name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear archivos del proyecto (solo los que falten)
        run: |
          write() { [ -f "$1" ] && return; mkdir -p "$(dirname "$1")"; cat > "$1"; }
          write settings.gradle.kts <<'GUARDIAN_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Guardian"
          include(":app")
          GUARDIAN_EOF
          write app/build.gradle.kts <<'GUARDIAN_EOF'
          plugins {
              id("com.android.application") version "8.5.2"
              id("org.jetbrains.kotlin.android") version "2.0.20"
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20"
          }

          android {
              namespace = "com.example.guardian"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.guardian"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures { compose = true }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          GUARDIAN_EOF
          write app/src/main/AndroidManifest.xml <<'GUARDIAN_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />

              <application
                  android:label="Guardian"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          GUARDIAN_EOF
          write app/src/main/java/com/example/guardian/AppScanner.kt <<'GUARDIAN_EOF'
          package com.example.guardian

          import android.app.admin.DevicePolicyManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageInfo
          import android.content.pm.PackageManager
          import android.provider.Settings
          import androidx.core.app.NotificationManagerCompat
          import java.io.File
