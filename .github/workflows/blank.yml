name: Compilar AguScanner Pro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar AguScanner e Icono Base64
        run: |
          write() { [ -f "$1" ] && return; mkdir -p "$(dirname "$1")"; cat > "$1"; }
          
          write gradle.properties <<'GUARDIAN_EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          GUARDIAN_EOF

          write settings.gradle.kts <<'GUARDIAN_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AguScanner"
          include(":app")
          GUARDIAN_EOF

          write app/build.gradle.kts <<'GUARDIAN_EOF'
          plugins {
              id("com.android.application") version "8.5.2"
              id("org.jetbrains.kotlin.android") version "2.0.20"
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20"
          }

          android {
              namespace = "com.example.aguscan"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.aguscan"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 9
                  versionName = "3.1"
              }

              buildFeatures { compose = true }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.5")
          }
          GUARDIAN_EOF

          # Generar carpetas de iconos e insertar imagen por defecto si no existe vía curl
          mkdir -p app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi
          
          # Descarga robusta con alternativa de respaldo o generación de icono seguro
          curl -L "https://raw.githubusercontent.com/ElFurl/guardian/main/assets/1792126332744.jpg" -o app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          
          # Si el archivo descargado está vacío, creamos un marcador válido para que no falle el empaquetado
          if [ ! -s app/src/main/res/mipmap-xxhdpi/ic_launcher.png ]; then
              python3 -c "
              import urllib.request
              try:
                  urllib.request.urlretrieve('https://raw.githubusercontent.com/ElFurl/guardian/main/assets/icon.png', 'app/src/main/res/mipmap-xxhdpi/ic_launcher.png')
              except:
                  pass
              "
          fi

          # Copiar a las demás densidades para asegurar compatibilidad total en Xiaomi
          cp -f app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || true
          cp -f app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || true
          cp -f app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png 2>/dev/null || true

          write app/src/main/AndroidManifest.xml <<'GUARDIAN_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="AguScanner"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:allowBackup="false"
                  android:fullBackupContent="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          GUARDIAN_EOF

          write app/src/main/java/com/example/aguscan/AppScanner.kt <<'GUARDIAN_EOF'
          package com.example.aguscan

          import android.app.admin.DevicePolicyManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageInfo
          import android.content.pm.PackageManager
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.provider.Settings
          import androidx.core.app.NotificationManagerCompat
          import java.io.File
          import java.security.MessageDigest

          enum class Risk { LOW, MEDIUM, HIGH }

          data class Finding(
              val pkg: String,
              val label: String,
              val risk: Risk,
              val reasons: List<String>,
              val sha256: String
          )

          data class FileFinding(
              val path: String,
              val name: String,
              val risk: Risk,
              val reason: String
          )

          data class NetworkAudit(
              val statusMessage: String,
              val isVpnActive: Boolean,
              val hasUserCAs: Boolean,
              val risk: Risk
          )

          class AppScanner(private val ctx: Context) {

              private val pm = ctx.packageManager

              private val remoteControlApps = setOf(
                  "com.anydesk.anydeskandroid", "com.teamviewer.quicksupport.market",
                  "com.teamviewer.host.market", "com.rustdesk", "com.splashtop.remote.viewer"
              )

              private val spyPermissions = setOf(
                  "android.permission.READ_SMS", "android.permission.RECORD_AUDIO",
                  "android.permission.ACCESS_BACKGROUND_LOCATION",
                  "android.permission.READ_CALL_LOG", "android.permission.CAMERA"
              )

              fun scanApps(): List<Finding> {
                  val enabledAccessibility = enabledAccessibilityPackages()
                  val notifListeners = NotificationManagerCompat.getEnabledListenerPackages(ctx)
                  val admins = deviceAdminPackages()

                  return pm.getInstalledPackages(PackageManager.GET_PERMISSIONS)
                      .filter { pkgInfo ->
                          val appInfo = pkgInfo.applicationInfo
                          val isSystem = appInfo?.flags?.and(ApplicationInfo.FLAG_SYSTEM) != 0
                          val name = pkgInfo.packageName
                          if (isSystem && (name.startsWith("com.miui.") || name.startsWith("com.xiaomi.") || name.startsWith("com.android."))) {
                              false
                          } else {
                              !isSystem
                          }
                      }
                      .mapNotNull { analyze(it, enabledAccessibility, notifListeners, admins) }
                      .sortedByDescending { it.risk }
              }

              private fun analyze(
                  p: PackageInfo,
                  accessibility: Set<String>,
                  listeners: Set<String>,
                  admins: Set<String>
              ): Finding? {
                  val reasons = mutableListOf<String>()
                  var score = 0
                  val name = p.packageName

                  val installer: String? = if (android.os.Build.VERSION.SDK_INT >= 30) {
                      pm.getInstallSourceInfo(name).installingPackageName
                  } else {
                      @Suppress("DEPRECATION")
                      pm.getInstallerPackageName(name)
                  }

                  val trusted = setOf("com.android.vending", "com.xiaomi.mipicks", "com.miui.packageinstaller", "com.google.android.packageinstaller")
                  if (installer !in trusted && installer != null) { 
                      reasons += "Instalada desde fuente externa u oficial desconocida: $installer"
                      score += 1 
                  }

                  if (name in accessibility) { reasons += "Servicio de Accesibilidad ACTIVO"; score += 3 }
                  if (name in listeners) { reasons += "Intercepta notificaciones del sistema"; score += 2 }
                  if (name in admins) { reasons += "Posee privilegios de Administrador"; score += 3 }
                  if (name in remoteControlApps) { reasons += "Herramienta de control remoto detectada"; score += 2 }

                  if (pm.getLaunchIntentForPackage(name) == null) {
                      reasons += "Aplicación oculta (Sin icono visible)"; score += 2
                  }

                  val perms = p.requestedPermissions?.toSet().orEmpty()
                  val spy = perms.intersect(spyPermissions)
                  if (spy.size >= 3) {
                      reasons += "Alto nivel de permisos combinados de espionaje"
                      score += 2
                  }

                  if (score == 0) return null
                  val risk = when { score >= 5 -> Risk.HIGH; score >= 3 -> Risk.MEDIUM; else -> Risk.LOW }

                  val sourceDir = p.applicationInfo?.sourceDir
                  val hash = if (sourceDir != null) sha256(File(sourceDir)) else "DESCONOCIDO"

                  return Finding(
                      pkg = name,
                      label = p.applicationInfo?.let { pm.getApplicationLabel(it).toString() } ?: name,
                      risk = risk,
                      reasons = reasons,
                      sha256 = hash
                  )
              }

              fun scanStorageForRisks(): List<FileFinding> {
                  val findings = mutableListOf<FileFinding>()
                  val externalStorage = android.os.Environment.getExternalStorageDirectory()
                  
                  if (externalStorage.exists() && externalStorage.canRead()) {
                      val downloadDir = File(externalStorage, "Download")
                      if (downloadDir.exists()) {
                          downloadDir.walkTopDown().maxDepth(3).forEach { file ->
                              if (file.isFile && file.extension.lowercase() == "apk") {
                                  findings.add(
                                      FileFinding(
                                          path = file.absolutePath,
                                          name = file.name,
                                          risk = Risk.MEDIUM,
                                          reason = "Archivo APK suelto en descargas"
                                      )
                                  )
                              }
                          }
                      }
                  }
                  return findings
              }

              fun auditNetworkAndInterception(): NetworkAudit {
                  val cm = ctx.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val network = cm.activeNetwork
                  val caps = cm.getNetworkCapabilities(network)
                  
                  val isVpnActive = caps?.hasTransport(NetworkCapabilities.TRANSPORT_VPN) == true
                  val userCertDir = File("/data/misc/keychain/cacerts-added/")
                  val hasUserCAs = userCertDir.exists() && (userCertDir.listFiles()?.isNotEmpty() == true)

                  val message = buildString {
                      if (isVpnActive) {
                          append("⚠️ ALERTA: Conexión VPN activa.\n")
                      } else {
                          append("✓ Sin túneles VPN activos.\n")
                      }
                      if (hasUserCAs) {
                          append("⚠️ ALERTA CRÍTICA: Certificados raíz de usuario detectados.")
                      } else {
                          append("✓ Almacén de certificados limpio.")
                      }
                  }

                  val risk = if (isVpnActive || hasUserCAs) Risk.HIGH else Risk.LOW

                  return NetworkAudit(
                      statusMessage = message.trim(),
                      isVpnActive = isVpnActive,
                      hasUserCAs = hasUserCAs,
                      risk = risk
                  )
              }

              private fun enabledAccessibilityPackages(): Set<String> {
                  val raw = Settings.Secure.getString(ctx.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return emptySet()
                  return raw.split(':').mapNotNull { it.substringBefore('/').ifBlank { null } }.toSet()
              }

              private fun deviceAdminPackages(): Set<String> {
                  val dpm = ctx.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  return dpm.activeAdmins?.map { it.packageName }?.toSet().orEmpty()
              }

              private fun sha256(file: File): String {
                  return try {
                      val md = MessageDigest.getInstance("SHA-256")
                      file.inputStream().use { s ->
                          val buf = ByteArray(8192)
                          while (true) { val n = s.read(buf); if (n < 0) break; md.update(buf, 0, n) }
                      }
                      md.digest().joinToString("") { "%02x".format(it) }
                  } catch (e: Exception) {
                      "Error calculando hash"
                  }
              }

              fun requestUninstall(pkg: String) = Intent(Intent.ACTION_DELETE).apply {
                  data = android.net.Uri.parse("package:$pkg")
                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              }.also { ctx.startActivity(it) }

              fun openAppSettings(pkg: String) = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                  data = android.net.Uri.parse("package:$pkg")
                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              }.also { ctx.startActivity(it) }
          }
          GUARDIAN_EOF

          write app/src/main/java/com/example/aguscan/MainActivity.kt <<'GUARDIAN_EOF'
          package com.example.aguscan

          import android.graphics.drawable.Drawable
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.graphics.drawable.toBitmap
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { 
                      MaterialTheme(colorScheme = darkColorScheme(
                          background = Color(0xFF0F111A),
                          surface = Color(0xFF181B28),
                          primary = Color(0xFF7C4DFF),
                          secondary = Color(0xFF00E676)
                      )) { 
                          Surface(modifier = Modifier.fillMaxSize()) { 
                              ScannerScreen() 
                          } 
                      } 
                  }
              }
          }

          @Composable
          fun ScannerScreen() {
              val ctx = LocalContext.current
              val scanner = remember { AppScanner(ctx) }
              val scope = rememberCoroutineScope()
              
              var findings by remember { mutableStateOf<List<Finding>?>(null) }
              var fileFindings by remember { mutableStateOf<List<FileFinding>>(emptyList()) }
              var networkAudit by remember { mutableStateOf<NetworkAudit?>(null) }
              
              var scanning by remember { mutableStateOf(false) }
              var progress by remember { mutableStateOf(0f) }
              var statusText by remember { mutableStateOf("Sistema preparado") }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(
                          Brush.verticalGradient(
                              colors = listOf(Color(0xFF0F111A), Color(0xFF16192B))
                          )
                      )
              ) {
                  Column(Modifier.fillMaxSize().padding(16.dp).statusBarsPadding()) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column {
                              Text("AGUSCANNER", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Black, color = Color.White)
                              Text("Seguridad & Privacidad Avanzada", style = MaterialTheme.typography.bodySmall, color = Color(0xFF94A3B8))
                          }
                          Surface(
                              color = if (scanning) Color(0xFFFF9800) else Color(0xFF00C853),
                              shape = RoundedCornerShape(20.dp),
                              shadowElevation = 4.dp
                          ) {
                              Text(
                                  text = if (scanning) "ESCANEANDO" else "PROTEGIDO",
                                  modifier = Modifier.padding(horizontal = 12.dp, vertical = 6.dp),
                                  style = MaterialTheme.typography.labelMedium,
                                  color = Color.White,
                                  fontWeight = FontWeight.Bold
                              )
                          }
                      }
                      
                      Spacer(Modifier.height(20.dp))

                      Button(
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(56.dp),
                          shape = RoundedCornerShape(16.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF7C4DFF)),
                          elevation = ButtonDefaults.buttonElevation(defaultElevation = 6.dp),
                          enabled = !scanning,
                          onClick = {
                              scanning = true
                              progress = 0f
                              findings = null
                              
                              scope.launch {
                                  statusText = "Analizando aplicaciones..."
                                  progress = 0.25f
                                  delay(350)
                                  val appResults = withContext(Dispatchers.Default) { scanner.scanApps() }
                                  
                                  statusText = "Revisando almacenamiento..."
                                  progress = 0.6f
                                  delay(350)
                                  val storageResults = withContext(Dispatchers.Default) { scanner.scanStorageForRisks() }
                                  
                                  statusText = "Auditando interfaces de red..."
                                  progress = 0.9f
                                  delay(350)
                                  val netResults = withContext(Dispatchers.Default) { scanner.auditNetworkAndInterception() }
                                  
                                  progress = 1f
                                  statusText = "¡Análisis completado!"
                                  
                                  findings = appResults
                                  fileFindings = storageResults
                                  networkAudit = netResults
                                  scanning = false
                              }
                          }
                      ) { 
                          Text(
                              text = if (scanning) "Analizando amenazas..." else "INICIAR ESCANEO PROFUNDO", 
                              fontSize = 15.sp, 
                              fontWeight = FontWeight.Bold,
                              color = Color.White
                          ) 
                      }

                      Spacer(Modifier.height(14.dp))

                      AnimatedVisibility(visible = scanning) {
                          Column(Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                              LinearProgressIndicator(
                                  progress = { progress },
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .height(8.dp)
                                      .clip(RoundedCornerShape(4.dp)),
                                  color = Color(0xFF00E676),
                                  trackColor = Color(0xFF262A40)
                              )
                              Spacer(Modifier.height(6.dp))
                              Text(statusText, style = MaterialTheme.typography.bodySmall, color = Color(0xFFB0BEC5))
                          }
                      }

                      Spacer(Modifier.height(10.dp))

                      LazyColumn(
                          verticalArrangement = Arrangement.spacedBy(12.dp), 
                          modifier = Modifier.weight(1f)
                      ) {
                          networkAudit?.let { net ->
                              item {
                                  val cardBg = if (net.risk == Risk.HIGH) Color(0xFF3D1212) else Color(0xFF142921)
                                  Card(
                                      modifier = Modifier.fillMaxWidth(),
                                      colors = CardDefaults.cardColors(containerColor = cardBg),
                                      elevation = CardDefaults.cardElevation(defaultElevation = 4.dp)
                                  ) {
                                      Column(Modifier.padding(16.dp)) {
                                          Row(verticalAlignment = Alignment.CenterVertically) {
                                              Text("🔒", fontSize = 20.sp)
                                              Spacer(Modifier.width(8.dp))
                                              Text("Auditoría de Red y Tráfico", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold, color = Color.White)
                                          }
                                          Spacer(Modifier.height(8.dp))
                                          Text(net.statusMessage, style = MaterialTheme.typography.bodyMedium, color = Color(0xFFE2E8F0))
                                      }
                                  }
                              }
                          }

                          if (!findings.isNullOrEmpty()) {
                              item { 
                                  Spacer(Modifier.height(4.dp))
                                  Text("Aplicaciones de Riesgo (${findings!!.size})", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold, color = Color.White) 
                              }
                              items(findings!!, key = { it.pkg }) { f -> FindingCard(f, scanner, ctx) }
                          }

                          if (fileFindings.isNotEmpty()) {
                              item { 
                                  Spacer(Modifier.height(4.dp))
                                  Text("Archivos APK en Descargas (${fileFindings.size})", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold, color = Color.White) 
                              }
                              items(fileFindings, key = { it.path }) { ff -> FileFindingCard(ff) }
                          }

                          if (findings != null && findings!!.isEmpty() && fileFindings.isEmpty() && networkAudit?.risk == Risk.LOW) {
                              item {
                                  Box(modifier = Modifier.fillMaxWidth().padding(vertical = 40.dp), contentAlignment = Alignment.Center) {
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          Text("🛡️", fontSize = 56.sp)
                                          Spacer(Modifier.height(12.dp))
                                          Text("¡Dispositivo 100% Protegido!", color = Color(0xFF00E676), fontWeight = FontWeight.Bold, fontSize = 18.sp)
                                          Spacer(Modifier.height(4.dp))
                                          Text("Sin aplicaciones espía ni amenazas detectadas.", color = Color(0xFF94A3B8), fontSize = 13.sp)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun FindingCard(f: Finding, scanner: AppScanner, ctx: android.content.Context) {
              val badgeColor = when (f.risk) {
                  Risk.HIGH -> Color(0xFFD32F2F)
                  Risk.MEDIUM -> Color(0xFFF57C00)
                  Risk.LOW -> Color(0xFF388E3C)
              }

              val appIcon: Drawable? = remember(f.pkg) {
                  try { ctx.packageManager.getApplicationIcon(f.pkg) } catch (e: Exception) { null }
              }

              Card(
                  modifier = Modifier.fillMaxWidth(), 
                  colors = CardDefaults.cardColors(containerColor = Color(0xFF181B28)),
                  elevation = CardDefaults.cardElevation(defaultElevation = 3.dp)
              ) {
                  Column(Modifier.padding(16.dp)) {
                      Row(
                          modifier = Modifier.fillMaxWidth(), 
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.weight(1f)) {
                              if (appIcon != null) {
                                  val bitmap = remember(appIcon) { appIcon.toBitmap(width = 96, height = 96).asImageBitmap() }
                                  Image(
                                      bitmap = bitmap,
                                      contentDescription = null,
                                      modifier = Modifier.size(40.dp).clip(CircleShape)
                                  )
                                  Spacer(Modifier.width(12.dp))
                              }
                              Column {
                                  Text(f.label, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold, color = Color.White)
                                  Text(f.pkg, style = MaterialTheme.typography.bodySmall, color = Color(0xFF94A3B8))
                              }
                          }
                          Surface(color = badgeColor, shape = RoundedCornerShape(8.dp)) {
                              Text(f.risk.name, modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp), style = MaterialTheme.typography.labelSmall, color = Color.White, fontWeight = FontWeight.Bold)
                          }
                      }
                      
                      Spacer(Modifier.height(10.dp))

                      f.reasons.forEach { 
                          Text("• $it", style = MaterialTheme.typography.bodyMedium, color = Color(0xFFCFD8DC))
                          Spacer(Modifier.height(2.dp))
                      }
                      
                      Spacer(Modifier.height(14.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                          OutlinedButton(
                              onClick = { scanner.openAppSettings(f.pkg) },
                              colors = ButtonDefaults.outlinedButtonColors(contentColor = Color(0xFFB388FF))
                          ) { 
                              Text("Ajustes") 
                          }
                          Button(
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD32F2F)),
                              onClick = { scanner.requestUninstall(f.pkg) }
                          ) { 
                              Text("Desinstalar") 
                          }
                      }
                  }
              }
          }

          @Composable
          fun FileFindingCard(ff: FileFinding) {
              Card(
                  modifier = Modifier.fillMaxWidth(), 
                  colors = CardDefaults.cardColors(containerColor = Color(0xFF181B28)),
                  elevation = CardDefaults.cardElevation(defaultElevation = 3.dp)
              ) {
                  Column(Modifier.padding(16.dp)) {
                      Text(ff.name, color = Color(0xFFFFB74D), style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)
                      Text(ff.path, style = MaterialTheme.typography.bodySmall, color = Color(0xFF94A3B8))
                      Spacer(Modifier.height(6.dp))
                      Text("• ${ff.reason}", style = MaterialTheme.typography.bodyMedium, color = Color(0xFFCFD8DC))
                  }
              }
          }
          GUARDIAN_EOF

      - name: Compilar APK con Gradle Directo
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: aguscan-apk-ultimate
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AguScanner build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
