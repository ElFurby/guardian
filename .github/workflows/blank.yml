name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear archivos del proyecto (solo los que falten)
        run: |
          write() { [ -f "$1" ] && return; mkdir -p "$(dirname "$1")"; cat > "$1"; }
          write settings.gradle.kts <<'GUARDIAN_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Guardian"
          include(":app")
          GUARDIAN_EOF
          write app/build.gradle.kts <<'GUARDIAN_EOF'
          plugins {
              id("com.android.application") version "8.5.2"
              id("org.jetbrains.kotlin.android") version "2.0.20"
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20"
          }

          android {
              namespace = "com.example.guardian"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.guardian"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures { compose = true }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          GUARDIAN_EOF
          write app/src/main/AndroidManifest.xml <<'GUARDIAN_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />

              <application
                  android:label="Guardian"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          GUARDIAN_EOF
          write app/src/main/java/com/example/guardian/AppScanner.kt <<'GUARDIAN_EOF'
          package com.example.guardian

          import android.app.admin.DevicePolicyManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageInfo
          import android.content.pm.PackageManager
          import android.provider.Settings
          import androidx.core.app.NotificationManagerCompat
          import java.io.File
          import java.security.MessageDigest

          enum class Risk { LOW, MEDIUM, HIGH }

                    data class Finding(
              val pkg: String,
              val label: String,
              val risk: Risk,
              val reasons: List<String>,
              val sha256: String
          )

          class AppScanner(private val ctx: Context) {

              private val pm = ctx.packageManager

              private val remoteControlApps = setOf(
                  "com.anydesk.anydeskandroid", "com.teamviewer.quicksupport.market",
                  "com.teamviewer.host.market", "com.rustdesk"
              )

              private val spyPermissions = setOf(
                  "android.permission.READ_SMS", "android.permission.RECORD_AUDIO",
                  "android.permission.ACCESS_BACKGROUND_LOCATION",
                  "android.permission.READ_CALL_LOG", "android.permission.CAMERA"
              )

              fun scan(): List<Finding> {
                  val enabledAccessibility = enabledAccessibilityPackages()
                  val notifListeners = NotificationManagerCompat.getEnabledListenerPackages(ctx)
                  val admins = deviceAdminPackages()

                  return pm.getInstalledPackages(PackageManager.GET_PERMISSIONS)
                      .filter { it.applicationInfo?.flags?.and(ApplicationInfo.FLAG_SYSTEM) == 0 }
                      .mapNotNull { analyze(it, enabledAccessibility, notifListeners, admins) }
                      .sortedByDescending { it.risk }
              }

              private fun analyze(
                  p: PackageInfo,
                  accessibility: Set<String>,
                  listeners: Set<String>,
                  admins: Set<String>
              ): Finding? {
                  val reasons = mutableListOf<String>()
                  var score = 0
                  val name = p.packageName

                  val installer: String? = if (android.os.Build.VERSION.SDK_INT >= 30) {
                      pm.getInstallSourceInfo(name).installingPackageName
                  } else {
                      @Suppress("DEPRECATION")
                      pm.getInstallerPackageName(name)
                  }

                  // Xiaomi usa GetApps (com.xiaomi.mipicks) y Play Store como fuentes legítimas
                  val trusted = setOf("com.android.vending", "com.xiaomi.mipicks", "com.miui.packageinstaller")
                  if (installer !in trusted) { reasons += "Instalada fuera de tiendas oficiales"; score += 1 }

                  if (name in accessibility) { reasons += "Servicio de Accesibilidad ACTIVO (puede leer tu pantalla)"; score += 3 }
                  if (name in listeners) { reasons += "Lee tus notificaciones"; score += 2 }
                  if (name in admins) { reasons += "Es administrador del dispositivo"; score += 3 }
                  if (name in remoteControlApps) { reasons += "App de control remoto"; score += 2 }

                  if (pm.getLaunchIntentForPackage(name) == null) {
                      reasons += "Sin icono en el lanzador (oculta)"; score += 2
                  }

                  val perms = p.requestedPermissions?.toSet().orEmpty()
                  val spy = perms.intersect(spyPermissions)
                  if (spy.size >= 3) {
                      reasons += "Combo de permisos de espionaje: ${spy.joinToString { it.substringAfterLast('.') }}"
                      score += 2
                  }
                  if (score == 0) return null
                  val risk = when { score >= 5 -> Risk.HIGH; score >= 3 -> Risk.MEDIUM; else -> Risk.LOW }

                  return Finding(
                      pkg = name,
                      label = pm.getApplicationLabel(p.applicationInfo!!).toString(),
                      
                      risk = risk,
                      reasons = reasons,
                      sha256 = sha256(File(p.applicationInfo!!.sourceDir))
                  )
              }

              private fun enabledAccessibilityPackages(): Set<String> {
                  val raw = Settings.Secure.getString(
                      ctx.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return emptySet()
                  return raw.split(':').mapNotNull { it.substringBefore('/').ifBlank { null } }.toSet()
              }

              private fun deviceAdminPackages(): Set<String> {
                  val dpm = ctx.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  return dpm.activeAdmins?.map { it.packageName }?.toSet().orEmpty()
              }

              private fun sha256(file: File): String {
                  val md = MessageDigest.getInstance("SHA-256")
                  file.inputStream().use { s ->
                      val buf = ByteArray(8192)
                      while (true) { val n = s.read(buf); if (n < 0) break; md.update(buf, 0, n) }
                  }
                  return md.digest().joinToString("") { "%02x".format(it) }
              }

              // --- "Expulsar": solo se puede pedir al usuario que confirme ---

              fun requestUninstall(pkg: String) = Intent(Intent.ACTION_DELETE).apply {
                  data = android.net.Uri.parse("package:$pkg")
                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              }.also(ctx::startActivity)

              fun openAppSettings(pkg: String) = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                  data = android.net.Uri.parse("package:$pkg")
                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              }.also(ctx::startActivity)

              fun openAccessibilitySettings() =
                  ctx.startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
          }
          GUARDIAN_EOF
          write app/src/main/java/com/example/guardian/MainActivity.kt <<'GUARDIAN_EOF'
          package com.example.guardian

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { MaterialTheme { Surface { ScannerScreen() } } }
              }
          }

          @Composable
          fun ScannerScreen() {
              val ctx = LocalContext.current
              val scanner = remember { AppScanner(ctx) }
              val scope = rememberCoroutineScope()
              var findings by remember { mutableStateOf<List<Finding>?>(null) }
              var scanning by remember { mutableStateOf(false) }

              Column(Modifier.fillMaxSize().padding(16.dp).statusBarsPadding()) {
                  Text("Guardian", style = MaterialTheme.typography.headlineMedium)
                  Spacer(Modifier.height(12.dp))

                  Button(
                      enabled = !scanning,
                      onClick = {
                          scanning = true
                          scope.launch {
                              findings = withContext(Dispatchers.Default) { scanner.scan() }
                              scanning = false
                          }
                      }
                  ) { Text(if (scanning) "Analizando..." else "Analizar teléfono") }

                  Spacer(Modifier.height(12.dp))

                  findings?.let { list ->
                      if (list.isEmpty()) Text("No se encontraron señales sospechosas.")
                      else LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          items(list, key = { it.pkg }) { f -> FindingCard(f, scanner) }
                      }
                  }
              }
          }

          @Composable
          fun FindingCard(f: Finding, scanner: AppScanner) {
              val color = when (f.risk) {
                  Risk.HIGH -> Color(0xFFD32F2F)
                  Risk.MEDIUM -> Color(0xFFF57C00)
                  Risk.LOW -> Color(0xFF689F38)
              }
              Card(Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(12.dp)) {
                      Text("${f.label} · ${f.risk}", color = color, style = MaterialTheme.typography.titleMedium)
                      Text(f.pkg, style = MaterialTheme.typography.bodySmall)
                      Spacer(Modifier.height(6.dp))
                      f.reasons.forEach { Text("• $it", style = MaterialTheme.typography.bodyMedium) }
                      Spacer(Modifier.height(8.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedButton(onClick = { scanner.openAppSettings(f.pkg) }) { Text("Ajustes") }
                          Button(onClick = { scanner.requestUninstall(f.pkg) }) { Text("Desinstalar") }
                      }
                  }
              }
          }
          GUARDIAN_EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: gradle assembleDebug -Pandroid.useAndroidX=true --no-daemon

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: guardian-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Guardian build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
