name: Compilar APK Pro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear archivos del proyecto (solo los que falten)
        run: |
          write() { [ -f "$1" ] && return; mkdir -p "$(dirname "$1")"; cat > "$1"; }
          
          write settings.gradle.kts <<'GUARDIAN_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Guardian"
          include(":app")
          GUARDIAN_EOF

          write app/build.gradle.kts <<'GUARDIAN_EOF'
          plugins {
              id("com.android.application") version "8.5.2"
              id("org.jetbrains.kotlin.android") version "2.0.20"
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20"
          }

          android {
              namespace = "com.example.guardian"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.guardian"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures { compose = true }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.5")
          }
          GUARDIAN_EOF

          write app/src/main/AndroidManifest.xml <<'GUARDIAN_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:label="Guardian Pro"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:allowBackup="false"
                  android:fullBackupContent="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          GUARDIAN_EOF

          write app/src/main/java/com/example/guardian/AppScanner.kt <<'GUARDIAN_EOF'
          package com.example.guardian

          import android.app.admin.DevicePolicyManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageInfo
          import android.content.pm.PackageManager
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.provider.Settings
          import androidx.core.app.NotificationManagerCompat
          import java.io.File
          import java.security.MessageDigest

          enum class Risk { LOW, MEDIUM, HIGH }

          data class Finding(
              val pkg: String,
              val label: String,
              val risk: Risk,
              val reasons: List<String>,
              val sha256: String
          )

          data class FileFinding(
              val path: String,
              val name: String,
              val risk: Risk,
              val reason: String
          )

          class AppScanner(private val ctx: Context) {

              private val pm = ctx.packageManager

              private val remoteControlApps = setOf(
                  "com.anydesk.anydeskandroid", "com.teamviewer.quicksupport.market",
                  "com.teamviewer.host.market", "com.rustdesk", "com.splashtop.remote.viewer"
              )

              private val spyPermissions = setOf(
                  "android.permission.READ_SMS", "android.permission.RECORD_AUDIO",
                  "android.permission.ACCESS_BACKGROUND_LOCATION",
                  "android.permission.READ_CALL_LOG", "android.permission.CAMERA"
              )

              fun scanApps(): List<Finding> {
                  val enabledAccessibility = enabledAccessibilityPackages()
                  val notifListeners = NotificationManagerCompat.getEnabledListenerPackages(ctx)
                  val admins = deviceAdminPackages()

                  return pm.getInstalledPackages(PackageManager.GET_PERMISSIONS)
                      .filter { it.applicationInfo?.flags?.and(ApplicationInfo.FLAG_SYSTEM) == 0 }
                      .mapNotNull { analyze(it, enabledAccessibility, notifListeners, admins) }
                      .sortedByDescending { it.risk }
              }

              private fun analyze(
                  p: PackageInfo,
                  accessibility: Set<String>,
                  listeners: Set<String>,
                  admins: Set<String>
              ): Finding? {
                  val reasons = mutableListOf<String>()
                  var score = 0
                  val name = p.packageName

                  val installer: String? = if (android.os.Build.VERSION.SDK_INT >= 30) {
                      pm.getInstallSourceInfo(name).installingPackageName
                  } else {
                      @Suppress("DEPRECATION")
                      pm.getInstallerPackageName(name)
                  }

                  val trusted = setOf("com.android.vending", "com.xiaomi.mipicks", "com.miui.packageinstaller", "com.google.android.packageinstaller")
                  if (installer !in trusted && installer != null) { 
                      reasons += "Instalada desde fuente no oficial: $installer"
                      score += 1 
                  }

                  if (name in accessibility) { reasons += "Servicio de Accesibilidad ACTIVO (Monitoreo de pantalla)"; score += 3 }
                  if (name in listeners) { reasons += "Intercepta notificaciones del sistema"; score += 2 }
                  if (name in admins) { reasons += "Posee privilegios de Administrador del dispositivo"; score += 3 }
                  if (name in remoteControlApps) { reasons += "Herramienta de control remoto detectada"; score += 2 }

                  if (pm.getLaunchIntentForPackage(name) == null) {
                      reasons += "Aplicación oculta (Sin icono en el lanzador)"; score += 2
                  }

                  val perms = p.requestedPermissions?.toSet().orEmpty()
                  val spy = perms.intersect(spyPermissions)
                  if (spy.size >= 3) {
                      reasons += "Alto nivel de permisos sensibles: ${spy.joinToString { it.substringAfterLast('.') }}"
                      score += 2
                  }

                  if (score == 0) return null
                  val risk = when { score >= 5 -> Risk.HIGH; score >= 3 -> Risk.MEDIUM; else -> Risk.LOW }

                  val sourceDir = p.applicationInfo?.sourceDir
                  val hash = if (sourceDir != null) sha256(File(sourceDir)) else "DESCONOCIDO"

                  return Finding(
                      pkg = name,
                      label = p.applicationInfo?.let { pm.getApplicationLabel(it).toString() } ?: name,
                      risk = risk,
                      reasons = reasons,
                      sha256 = hash
                  )
              }

              fun scanStorageForRisks(): List<FileFinding> {
                  val findings = mutableListOf<FileFinding>()
                  val externalStorage = android.os.Environment.getExternalStorageDirectory()
                  
                  if (externalStorage.exists() && externalStorage.canRead()) {
                      val downloadDir = File(externalStorage, "Download")
                      if (downloadDir.exists()) {
                          downloadDir.walkTopDown().maxDepth(3).forEach { file ->
                              if (file.isFile && file.extension.lowercase() == "apk") {
                                  findings.add(
                                      FileFinding(
                                          path = file.absolutePath,
                                          name = file.name,
                                          risk = Risk.MEDIUM,
                                          reason = "Archivo APK suelto en descargas (potencial instalador olvidado o malicioso)"
                                      )
                                  )
                              }
                          }
                      }
                  }
                  return findings
              }

              fun checkNetworkInterception(): String {
                  val cm = ctx.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val network = cm.activeNetwork
                  val caps = cm.getNetworkCapabilities(network)
                  
                  return when {
                      caps == null -> "Sin conexión a internet activa."
                      caps.hasTransport(NetworkCapabilities.TRANSPORT_VPN) -> "⚠️ Advertencia: Hay una VPN activa. Su tráfico podría estar siendo enrutado o interceptado por un tercero."
                      caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) -> "Conectado vía Wi-Fi de manera estándar."
                      else -> "Conectado a red móvil."
                  }
              }

              private fun enabledAccessibilityPackages(): Set<String> {
                  val raw = Settings.Secure.getString(ctx.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return emptySet()
                  return raw.split(':').mapNotNull { it.substringBefore('/').ifBlank { null } }.toSet()
              }

              private fun deviceAdminPackages(): Set<String> {
                  val dpm = ctx.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  return dpm.activeAdmins?.map { it.packageName }?.toSet().orEmpty()
              }

              private fun sha256(file: File): String {
                  return try {
                      val md = MessageDigest.getInstance("SHA-256")
                      file.inputStream().use { s ->
                          val buf = ByteArray(8192)
                          while (true) { val n = s.read(buf); if (n < 0) break; md.update(buf, 0, n) }
                      }
                      md.digest().joinToString("") { "%02x".format(it) }
                  } catch (e: Exception) {
                      "Error calculando hash"
                  }
              }

              fun requestUninstall(pkg: String) = Intent(Intent.ACTION_DELETE).apply {
                  data = android.net.Uri.parse("package:$pkg")
                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              }.also(ctx::startActivity)

              fun openAppSettings(pkg: String) = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                  data = android.net.Uri.parse("package:$pkg")
                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              }.also(ctx::startActivity)
          }
          GUARDIAN_EOF

          write app/src/main/java/com/example/guardian/MainActivity.kt <<'GUARDIAN_EOF'
          package com.example.guardian

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { 
                      MaterialTheme(colorScheme = darkColorScheme()) { 
                          Surface(modifier = Modifier.fillMaxSize()) { 
                              ScannerScreen() 
                          } 
                      } 
                  }
              }
          }

          @Composable
          fun ScannerScreen() {
              val ctx = LocalContext.current
              val scanner = remember { AppScanner(ctx) }
              val scope = rememberCoroutineScope()
              
              var findings by remember { mutableStateOf<List<Finding>?>(null) }
              var fileFindings by remember { mutableStateOf<List<FileFinding>>(emptyList()) }
              var networkStatus by remember { mutableStateOf("No analizado") }
              var scanning by remember { mutableStateOf(false) }

              Column(Modifier.fillMaxSize().padding(16.dp).statusBarsPadding()) {
                  Text("Guardian Security Pro", style = MaterialTheme.typography.headlineMedium)
                  Text("Protección avanzada para Redmi / HyperOS", style = MaterialTheme.typography.bodySmall, color = Color.Gray)
                  
                  Spacer(Modifier.height(16.dp))

                  Button(
                      modifier = Modifier.fillMaxWidth(),
                      enabled = !scanning,
                      onClick = {
                          scanning = true
                          scope.launch {
                              findings = withContext(Dispatchers.Default) { scanner.scanApps() }
                              fileFindings = withContext(Dispatchers.Default) { scanner.scanStorageForRisks() }
                              networkStatus = withContext(Dispatchers.Default) { scanner.checkNetworkInterception() }
                              scanning = false
                          }
                      }
                  ) { 
                      Text(if (scanning) "Analizando sistema..." else "Iniciar Escaneo Completo") 
                  }

                  Spacer(Modifier.height(12.dp))

                  Card(modifier = Modifier.fillMaxWidth()) {
                      Column(Modifier.padding(12.dp)) {
                          Text("Estado de Red y Conexiones", style = MaterialTheme.typography.titleSmall)
                          Spacer(Modifier.height(4.dp))
                          Text(networkStatus, style = MaterialTheme.typography.bodyMedium)
                      }
                  }

                  Spacer(Modifier.height(12.dp))

                  if (scanning) {
                      Box(modifier = Modifier.fillMaxWidth().padding(24.dp), contentAlignment = Alignment.Center) {
                          CircularProgressIndicator()
                      }
                  } else {
                      LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillWeight(1f)) {
                          if (!findings.isNullOrEmpty()) {
                              item { Text("Aplicaciones Sospechosas (${findings!!.size})", style = MaterialTheme.typography.titleMedium) }
                              items(findings!!, key = { it.pkg }) { f -> FindingCard(f, scanner) }
                          }

                          if (fileFindings.isNotEmpty()) {
                              item { Text("Archivos en Riesgo (${fileFindings.size})", style = MaterialTheme.typography.titleMedium) }
                              items(fileFindings, key = { it.path }) { ff -> FileFindingCard(ff) }
                          }

                          if (findings != null && findings!!.isEmpty() && fileFindings.isEmpty()) {
                              item {
                                  Box(modifier = Modifier.fillMaxWidth().padding(32.dp), contentAlignment = Alignment.Center) {
                                      Text("¡Sistema Limpio! No se detectaron amenazas.", color = Color(0xFF689F38))
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun FindingCard(f: Finding, scanner: AppScanner) {
              val color = when (f.risk) {
                  Risk.HIGH -> Color(0xFFD32F2F)
                  Risk.MEDIUM -> Color(0xFFF57C00)
                  Risk.LOW -> Color(0xFF689F38)
              }
              Card(Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(12.dp)) {
                      Text("${f.label} · ${f.risk}", color = color, style = MaterialTheme.typography.titleMedium)
                      Text(f.pkg, style = MaterialTheme.typography.bodySmall, color = Color.LightGray)
                      Spacer(Modifier.height(6.dp))
                      f.reasons.forEach { Text("• $it", style = MaterialTheme.typography.bodyMedium) }
                      Spacer(Modifier.height(8.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedButton(onClick = { scanner.openAppSettings(f.pkg) }) { Text("Ajustes") }
                          Button(onClick = { scanner.requestUninstall(f.pkg) }) { Text("Desinstalar") }
                      }
                  }
              }
          }

          @Composable
          fun FileFindingCard(ff: FileFinding) {
              Card(Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(12.dp)) {
                      Text(ff.name, color = Color(0xFFF57C00), style = MaterialTheme.typography.titleMedium)
                      Text(ff.path, style = MaterialTheme.typography.bodySmall, color = Color.LightGray)
                      Spacer(Modifier.height(6.dp))
                      Text("• ${ff.reason}", style = MaterialTheme.typography.bodyMedium)
                  }
              }
          }
          GUARDIAN_EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Compilar APK en modo Debug
        run: gradle assembleDebug -Pandroid.useAndroidX=true --no-daemon

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: guardian-apk-pro
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Guardian Pro build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
