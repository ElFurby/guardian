                      .filter { it.applicationInfo?.flags?.and(ApplicationInfo.FLAG_SYSTEM) == 0 }
                      .mapNotNull { analyze(it, enabledAccessibility, notifListeners, admins) }
                      .sortedByDescending { it.risk }
              }

              private fun analyze(
                  p: PackageInfo,
                  accessibility: Set<String>,
                  listeners: Set<String>,
                  admins: Set<String>
              ): Finding? {
                  val reasons = mutableListOf<String>()
                  var score = 0
                  val name = p.packageName

                  val installer: String? = if (android.os.Build.VERSION.SDK_INT >= 30) {
                      pm.getInstallSourceInfo(name).installingPackageName
                  } else {
                      @Suppress("DEPRECATION")
                      pm.getInstallerPackageName(name)
                  }

                  // Xiaomi usa GetApps (com.xiaomi.mipicks) y Play Store como fuentes legítimas
                  val trusted = setOf("com.android.vending", "com.xiaomi.mipicks", "com.miui.packageinstaller")
                  if (installer !in trusted) { reasons += "Instalada fuera de tiendas oficiales"; score += 1 }

                  if (name in accessibility) { reasons += "Servicio de Accesibilidad ACTIVO (puede leer tu pantalla)"; score += 3 }
                  if (name in listeners) { reasons += "Lee tus notificaciones"; score += 2 }
                  if (name in admins) { reasons += "Es administrador del dispositivo"; score += 3 }
                  if (name in remoteControlApps) { reasons += "App de control remoto"; score += 2 }

                  if (pm.getLaunchIntentForPackage(name) == null) {
                      reasons += "Sin icono en el lanzador (oculta)"; score += 2
                  }

                  val perms = p.requestedPermissions?.toSet().orEmpty()
                  val spy = perms.intersect(spyPermissions)
                  if (spy.size >= 3) {
                      reasons += "Combo de permisos de espionaje: ${spy.joinToString { it.substringAfterLast('.') }}"
                      score += 2
                  }
                  if (score == 0) return null
                  val risk = when { score >= 5 -> Risk.HIGH; score >= 3 -> Risk.MEDIUM; else -> Risk.LOW }

